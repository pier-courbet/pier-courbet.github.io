<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technocritiques - articles</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <h1>Technocritiques</h1>
      </div>
      <nav class="site-nav">
        <a href="index.html">Accueil</a>
        <a href="ateliers.html">Ateliers</a>
        <a href="Articles.html">Articles</a>
        <a href="podcast.html">Podcast</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="blog-intro">
      <h2>Articles</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Rechercher parmi les articles..." class="search-input">
      </div>
    </section>

    <section class="blog-list" id="blogList">
      <article class="blog-card" data-title="Qu'est-ce que la technocritique ?" data-content="Résumé court de l'article pour donner envie de lire.">
        <h3><a href="Articles/article01-technocritique.html">Qu'est-ce que la technocritique ?</a></h3>
        <p class="meta">Publié le 17 mai 2026</p>
        <p>Résumé court de l'article pour donner envie de lire.</p>
      </article>

      <article class="blog-card" data-title="Titre de l'article 2" data-content="Résumé court du second article.">
        <h3><a href="article-2.html">Titre de l’article 2</a></h3>
        <p class="meta">Publié le 15 mai 2026</p>
        <p>Résumé court du second article.</p>
      </article>
    </section>
  </main>

  <p> </p>

  <footer class="site-footer">
    <p>© 2026 Technocritiques</p>
  </footer>

  <script>
    const searchInput = document.getElementById('searchInput');
    const blogCards = document.querySelectorAll('.blog-card');

    searchInput.addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase();

      blogCards.forEach(card => {
        const title = card.getAttribute('data-title').toLowerCase();
        const content = card.getAttribute('data-content').toLowerCase();

        if (title.includes(searchTerm) || content.includes(searchTerm)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
